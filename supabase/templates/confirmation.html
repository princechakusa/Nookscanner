<h2>Confirm your Nookscanner account</h2>
<p>Hello,</p>
<p>Your confirmation code (type it in the Nookscanner app):</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px">{{ .Token }}</p>
<p>Or, on the computer where you signed up, confirm with this link:</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app"
    >Confirm my email</a
  >
</p>
<p>The code expires in 1 hour. If you did not create an account, you can ignore this email.</p>
