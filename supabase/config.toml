# Supabase CLI configuration (local development stack + settings mirrored to hosted projects).
# Hand-written during the foundation stage (the CLI was not installed). When the user runs
# `supabase init`, answer NO to overwriting this file; `supabase link --project-ref nfcnckwjrwpofkrzribd`
# links the hosted project without changing migrations.
# Hosted project: ref nfcnckwjrwpofkrzribd, URL https://nfcnckwjrwpofkrzribd.supabase.co (project name "nookscanner").
project_id = "nookscanner"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[edge_runtime]
enabled = true
