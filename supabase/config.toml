# Supabase CLI configuration (local development stack + settings mirrored to hosted projects).
# Hand-written during the foundation stage; validated against Supabase CLI 3.2.0. Never re-run
# `supabase init` over it. Local ports use the 565xx range so this stack can run alongside other
# local Supabase stacks on the same machine (the default 543xx ports are taken by other projects).
# Hosted project: ref nfcnckwjrwpofkrzribd, URL https://nfcnckwjrwpofkrzribd.supabase.co (project name "nookscanner").
project_id = "nookscanner"

[api]
enabled = true
port = 56521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56522
shadow_port = 56520
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[analytics]
enabled = false
port = 56527

[studio]
enabled = true
port = 56523

[local_smtp]
enabled = true
port = 56524

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# 6-digit codes in the emails (the phone app types them; links only work on the computer).
otp_length = 6
otp_expiry = 3600

# Links are built from site_url + token_hash and confirmed by a POST on /auth/confirm (works across
# devices, unlike PKCE links, and survives mail scanners). Mirror these templates on hosted projects.
[auth.email.template.confirmation]
subject = "Confirm your Nookscanner account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Nookscanner password"
content_path = "./supabase/templates/recovery.html"

# Passwordless sign-in code (capture app, "Email me a sign-in code").
[auth.email.template.magic_link]
subject = "Your Nookscanner sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Sign in with Apple, native iOS flow: the app sends Apple's identity token
# (signInWithIdToken). Audiences: the capture app and Expo Go (testing). No secret needed for
# the native flow; a Services ID + key are only for web sign-in.
[auth.external.apple]
enabled = true
client_id = "com.nookscanner.capture,host.exp.Exponent"
secret = ""

# Local stack only: allow E2E runs to send more than the default 2 emails per hour.
[auth.rate_limit]
email_sent = 100

[edge_runtime]
enabled = true
inspector_port = 56583

# Worker and scheduler authenticate with HMAC / a bearer secret, not a user JWT.
[functions.job-callback]
verify_jwt = false

[functions.dispatch-processing]
verify_jwt = false

[functions.claim-job]
verify_jwt = false

# Guests have no account: these functions authorise by QR token (Stage 9.1, ADR-023).
[functions.guest-experience]
verify_jwt = false

[functions.guest-instruction]
verify_jwt = false
