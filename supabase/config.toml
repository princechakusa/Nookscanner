# Supabase CLI configuration (local development stack + settings mirrored to hosted projects).
# Hand-written during the foundation stage; validated against Supabase CLI 3.2.0. Never re-run
# `supabase init` over it. Local ports use the 565xx range so this stack can run alongside other
# local Supabase stacks on the same machine (the default 543xx ports are taken by other projects).
# Hosted project: ref nfcnckwjrwpofkrzribd, URL https://nfcnckwjrwpofkrzribd.supabase.co (project name "nookscanner").
project_id = "nookscanner"

[api]
enabled = true
port = 56521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 56522
shadow_port = 56520
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[analytics]
enabled = false
port = 56527

[studio]
enabled = true
port = 56523

[local_smtp]
enabled = true
port = 56524

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[edge_runtime]
enabled = true
inspector_port = 56583
