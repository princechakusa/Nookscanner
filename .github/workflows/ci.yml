name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:56521
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      - run: npm run check:secrets
      # ffmpeg/ffprobe for the Stage 5.2 validation tests (real sample videos per device tier).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg && ffprobe -version | head -1
      - run: npm run test:worker
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  database-stack:
    # Real local Supabase stack in Docker (ADR-013): DB suites, Storage API tests, dashboard auth E2E.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx -y supabase@3.2.0 start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,postgres-meta,supavisor
      - run: npx -y supabase@3.2.0 db lint --level warning --fail-on warning
      - run: npm run test:stack -w @nookscanner/database
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e:stack
      - if: always()
        run: npx -y supabase@3.2.0 stop --no-backup

  capture-app:
    # Nookscanner Capture (Expo, outside the root workspaces, ADR-001/005): typecheck and an iOS
    # JS bundle prove the app and the linked packages/shared resolve. Device runs are manual.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/nookscanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/nookscanner/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx expo export --platform ios --output-dir dist-ci
        env:
          EXPO_PUBLIC_APP_ENV: local
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:56521
          EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
